[pytest]
# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests

# Coverage configuration
addopts =
    --verbose
    --strict-markers
    --tb=short
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=70

# Test markers for selective test execution
markers =
    unit: Unit tests (fast, isolated tests)
    integration: Integration tests (require external services like databases)
    slow: Slow tests (long-running tests, e.g., ML model training)
    ml_models: ML model validation tests
    requires_prophet: Tests requiring Prophet library
    requires_tensorflow: Tests requiring TensorFlow library
    requires_torch: Tests requiring PyTorch library
    requires_database: Tests requiring database connection

# Ignore patterns
norecursedirs = .git .tox dist build *.egg htmlcov .cache .pytest_cache

# Console output configuration
console_output_style = progress

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Timeout for tests (in seconds)
timeout = 300

# Parallel execution settings
# Use with: pytest -n auto
# Requires pytest-xdist

# Coverage source
[coverage:run]
source = .
omit =
    tests/*
    venv/*
    */site-packages/*
    setup.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
